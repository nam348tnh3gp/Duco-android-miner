name: Build Duino Miner APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Setup Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q android-ndk-r26c-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26c" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Increment version code
        run: |
          if [ -f versioncode.txt ]; then
            VERSION_CODE=$(cat versioncode.txt | tr -d '\r')
          else
            VERSION_CODE=0
          fi
          
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          
          VERSION_NAME=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '\r')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          
          NEW_VERSION="${VERSION_NAME}+${NEW_VERSION_CODE}"
          
          sed -i "s/version: .*/version: $NEW_VERSION/" pubspec.yaml
          
          echo $NEW_VERSION_CODE > versioncode.txt
          
          echo "✅ Version set to: $NEW_VERSION"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$NEW_VERSION_CODE" >> $GITHUB_ENV

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/upload-keystore.jks
          
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "❌ Keystore file is empty!"
            exit 1
          fi
          
          echo "📏 Keystore size: $(wc -c < android/app/upload-keystore.jks) bytes"
          echo "✅ Keystore restored"

      - name: Create key.properties
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "✅ key.properties created"

      - name: Build miner for Android (all architectures)
        run: |
          SOURCE_DIR=$PWD
          mkdir -p $SOURCE_DIR/output/{arm64-v8a,armeabi-v7a,x86_64,x86}
          cd $SOURCE_DIR/android/app/src/main/cpp
          
          build_arch() {
            local ARCH=$1
            local CC_ARCH=$2
            local OUTPUT_DIR=$3
            
            echo "🔨 Building for $ARCH..."
            mkdir -p build_$ARCH
            cd build_$ARCH
            
            $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$CC_ARCH \
              -O3 -Wall -pthread -fPIC \
              -I.. \
              -c ../miner_ffi.c -o miner_ffi.o
            
            $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$CC_ARCH \
              -shared -fPIC \
              miner_ffi.o \
              -o libminer.so \
              -lm -lc
            
            cp libminer.so $SOURCE_DIR/output/$OUTPUT_DIR/
            cd ..
          }
          
          build_arch "arm64" "aarch64-linux-android21-clang" "arm64-v8a"
          build_arch "arm" "armv7a-linux-androideabi21-clang" "armeabi-v7a"
          build_arch "x86_64" "x86_64-linux-android21-clang" "x86_64"
          build_arch "x86" "i686-linux-android21-clang" "x86"
          
          echo "✅ Build completed for all architectures."

      - name: Create Flutter project and copy sources
        run: |
          SOURCE_DIR=$PWD
          
          mkdir -p /tmp/source_backup
          cp -r $SOURCE_DIR/lib /tmp/source_backup/ 2>/dev/null || echo "No lib folder"
          cp $SOURCE_DIR/pubspec.yaml /tmp/source_backup/ 2>/dev/null || echo "No pubspec.yaml"
          cp -r $SOURCE_DIR/android/app/src/main/cpp /tmp/source_backup/ 2>/dev/null || echo "No cpp folder"
          
          flutter create --org com.TGFN --project-name ducominer /tmp/ducominer_temp
          
          rsync -av --exclude='.git' /tmp/ducominer_temp/ ./
          
          cp -r /tmp/source_backup/lib . 2>/dev/null || echo "No lib to copy"
          cp /tmp/source_backup/pubspec.yaml . 2>/dev/null || echo "No pubspec.yaml to copy"
          
          mkdir -p android/app/src/main/cpp
          cp /tmp/source_backup/cpp/*.h android/app/src/main/cpp/ 2>/dev/null || true
          cp /tmp/source_backup/cpp/*.c android/app/src/main/cpp/ 2>/dev/null || true
          cp /tmp/source_backup/cpp/CMakeLists.txt android/app/src/main/cpp/ 2>/dev/null || true
          
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p android/app/src/main/jniLibs/$arch
            cp $SOURCE_DIR/output/$arch/libminer.so android/app/src/main/jniLibs/$arch/ 2>/dev/null || true
          done
          
          cp android/app/upload-keystore.jks android/app/ 2>/dev/null || true
          cp android/key.properties android/ 2>/dev/null || true
          
          echo "✅ All sources copied successfully!"

      - name: Configure Android
        run: |
          # Cập nhật applicationId, minSdk, targetSdk
          sed -i 's/applicationId "com.example.*"/applicationId "com.TGFN.ducominer"/' android/app/build.gradle
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle
          
          # Thêm packagingOptions nếu chưa có
          if ! grep -q "packagingOptions" android/app/build.gradle; then
            sed -i '/android {/a \    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }' android/app/build.gradle
          fi
          
          # Thêm keystoreProperties SAU plugins block
          if ! grep -q "keystoreProperties" android/app/build.gradle; then
            sed -i '/plugins {/a \
            \
            def keystoreProperties = new Properties()\
            def keystorePropertiesFile = rootProject.file("key.properties")\
            if (keystorePropertiesFile.exists()) {\
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
            }' android/app/build.gradle
          fi
          
          # Thêm signingConfigs
          if ! grep -q "signingConfigs" android/app/build.gradle; then
            sed -i '/android {/a \    signingConfigs {\n        release {\n            keyAlias keystoreProperties.keyAlias\n            keyPassword keystoreProperties.keyPassword\n            storeFile file(keystoreProperties.storeFile)\n            storePassword keystoreProperties.storePassword\n        }\n    }' android/app/build.gradle
          fi
          
          # Thêm signingConfig vào release build
          if grep -q "buildTypes {" android/app/build.gradle; then
            if ! grep -q "signingConfig signingConfigs.release" android/app/build.gradle; then
              sed -i '/release {/a \            signingConfig signingConfigs.release' android/app/build.gradle
            fi
          fi
          
          # Thêm permissions
          if ! grep -q "INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest /a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q "FOREGROUND_SERVICE" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest /a \    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (full architecture)
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          echo "📱 APK info:"
          aapt dump badging build/app/outputs/flutter-apk/app-release.apk | grep -E "package|versionCode|versionName"
          echo ""
          echo "🔑 APK signature:"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep "SHA-256" || echo "⚠️ APK built successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ducominer-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Commit version changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml versioncode.txt
          git commit -m "Bump version to $(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r') [skip ci]" || echo "No changes to commit"
          git push